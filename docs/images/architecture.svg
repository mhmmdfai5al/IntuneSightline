<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#605e5c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#f3f2f1"/>

  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#201f1e">Four layers, one direction</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#605e5c">Calls only ever run left to right — core never calls a tool; the shell never reaches past a tool into Graph.</text>

  <!-- Browser -->
  <rect x="30" y="130" width="150" height="90" rx="4" fill="#ffffff" stroke="#d2d0ce" stroke-width="1"/>
  <text x="105" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#201f1e">Browser</text>
  <text x="105" y="188" text-anchor="middle" font-size="11" fill="#605e5c">127.0.0.1</text>

  <line x1="180" y1="175" x2="248" y2="175" stroke="#605e5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="214" y="165" text-anchor="middle" font-size="10" fill="#605e5c">HTTP</text>

  <!-- Shell -->
  <rect x="250" y="130" width="150" height="90" rx="4" fill="#ffffff" stroke="#d2d0ce" stroke-width="1"/>
  <text x="325" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#201f1e">Shell</text>
  <text x="325" y="188" text-anchor="middle" font-size="11" fill="#605e5c">no tool-specific code</text>

  <line x1="400" y1="175" x2="468" y2="175" stroke="#605e5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="434" y="165" text-anchor="middle" font-size="10" fill="#605e5c">dispatch</text>

  <!-- Tools -->
  <rect x="470" y="130" width="150" height="90" rx="4" fill="#ffffff" stroke="#d2d0ce" stroke-width="1"/>
  <text x="545" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#201f1e">Tools</text>
  <text x="545" y="188" text-anchor="middle" font-size="11" fill="#605e5c">manifest + one script</text>

  <line x1="620" y1="175" x2="688" y2="175" stroke="#605e5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="654" y="165" text-anchor="middle" font-size="10" fill="#605e5c">calls</text>

  <!-- Core -->
  <rect x="690" y="130" width="150" height="90" rx="4" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="765" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#201f1e">Core</text>
  <text x="765" y="188" text-anchor="middle" font-size="11" fill="#605e5c">auth, paging, batching</text>

  <!-- Core branches down to Graph and files -->
  <line x1="765" y1="220" x2="765" y2="245" stroke="#605e5c" stroke-width="1.5"/>
  <line x1="700" y1="245" x2="830" y2="245" stroke="#605e5c" stroke-width="1.5"/>
  <line x1="700" y1="245" x2="670" y2="278" stroke="#605e5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="245" x2="830" y2="278" stroke="#605e5c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="280" width="140" height="50" rx="4" fill="#eff6fc" stroke="#0078d4" stroke-width="1"/>
  <text x="670" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#004578">Microsoft Graph</text>
  <text x="670" y="316" text-anchor="middle" font-size="10" fill="#004578">read-only</text>

  <rect x="770" y="280" width="120" height="50" rx="4" fill="#f3f9f1" stroke="#107c10" stroke-width="1"/>
  <text x="830" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#0b590b">Files out</text>
  <text x="830" y="316" text-anchor="middle" font-size="10" fill="#0b590b">workbook · HTML</text>

  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#797775">The property that matters: adding the twentieth tool costs what adding the second did.</text>
</svg>
