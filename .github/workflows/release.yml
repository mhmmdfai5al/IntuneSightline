name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A published release can't be changed or re-tagged, so a tag that
      # disagrees with the code must stop here, before anything is published.
      - name: Tag matches the app version and changelog
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(grep -oP "SightlineVersion = '\K[0-9.]+" Start-IntuneSightline.ps1)
          if [ "$tag" != "$app" ]; then
            echo "::error::Tag v$tag does not match the app version $app in Start-IntuneSightline.ps1."
            exit 1
          fi
          if ! grep -q "^## \[$tag\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$tag] - YYYY-MM-DD' section."
            exit 1
          fi

      - name: Project checks
        shell: pwsh
        run: ./tests/Invoke-Checks.ps1

      - name: Build the archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p build/IntuneSightline
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' \
                --exclude 'tests' . build/IntuneSightline/
          cd build && zip -qr "../IntuneSightline-${version}.zip" IntuneSightline
          cd .. && ls -la IntuneSightline-*.zip

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: IntuneSightline-*.zip
          generate_release_notes: true
          body: |
            Download the zip below, extract it, and run:

            ```powershell
            ./Start-IntuneSightline.ps1
            ```

            Requires PowerShell 7. Nothing else to install.

            See CHANGELOG.md for what changed.
