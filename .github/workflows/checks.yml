name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project checks
        shell: pwsh
        run: ./tests/Invoke-Checks.ps1

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }
          Write-Host 'No errors from PSScriptAnalyzer.'
